name: build
on:
  push:
    branches: [main]
    paths: [catalog.json, wearers.json, images/**]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py && python3 scripts/build_badges.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add badges.json
          git diff --cached --quiet || (git commit -m "Собрать badges.json" && git push)
